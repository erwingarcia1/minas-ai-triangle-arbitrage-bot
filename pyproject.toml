[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "triarb"
version = "0.1.0"
description = "Single-exchange triangular arbitrage system (Phase 1: observer — market data, cycle detection, edge logging; no order code)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "websockets>=13.0",
    "orjson>=3.9",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
]

[project.scripts]
triarb = "triarb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["triarb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
